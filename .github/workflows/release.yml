name: Desktop release

# A manual run without release_tag builds CI artifacts without publishing.
# A manual run with an existing release_tag can recover a failed tag workflow.
# A four-part tag whose first three components match Cargo's workspace version
# builds the same artifacts and publishes them after all jobs pass.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing four-part tag to publish after a failed tag workflow (leave empty for a dry run)'
        required: false
        type: string
  push:
    tags:
      - '*.*.*.*'

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Check tag against upstream package version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          base = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          tag = os.environ['RELEASE_TAG']
          if re.fullmatch(re.escape(base) + r'\.[0-9]+', tag) is None:
              raise SystemExit(f'{tag!r} must be {base}.N (the fork release counter)')
          print(f'Validated release tag: {tag}')
          PY
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  macos-arm64:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies on the runner
        run: brew install pkg-config sdl3
      - name: Test
        run: cargo test --locked --workspace
      - name: Build
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            export TGPULSE_RELEASE_VERSION="$RELEASE_TAG"
          fi
          cargo build --locked --release -p tgpulse
      - name: Package a relocatable Metal executable
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_SHA:0:8}"
          if [[ -n "$RELEASE_TAG" ]]; then version="$RELEASE_TAG"; fi
          name="tgpulse-${version}-macos-arm64"
          mkdir -p "dist/$name"
          cp target/release/tgpulse LICENSE README.md "dist/$name/"
          cp -R LICENSES "dist/$name/"
          sdl="$(pkg-config --variable=libdir sdl3)/libSDL3.0.dylib"
          test -f "$sdl"
          cp -L "$sdl" "dist/$name/"
          cp "$(brew --prefix sdl3)/LICENSE.txt" "dist/$name/SDL3-LICENSE.txt"
          install_name_tool -id '@executable_path/libSDL3.0.dylib' "dist/$name/libSDL3.0.dylib"
          old_sdl="$(otool -L "dist/$name/tgpulse" | awk '/libSDL3\.0\.dylib/ { print $1; exit }')"
          test -n "$old_sdl"
          install_name_tool -change "$old_sdl" '@executable_path/libSDL3.0.dylib' "dist/$name/tgpulse"
          codesign --force --sign - --timestamp=none "dist/$name/libSDL3.0.dylib"
          codesign --force --sign - --timestamp=none "dist/$name/tgpulse"
          file "dist/$name/tgpulse" | grep -q arm64
          otool -L "dist/$name/tgpulse" | grep -q '@executable_path/libSDL3.0.dylib'
          ! otool -L "dist/$name/tgpulse" | grep -q '/opt/homebrew/'
          if [[ -n "$RELEASE_TAG" ]]; then
            test "$("dist/$name/tgpulse" --version)" = "tgpulse $version"
          else
            "dist/$name/tgpulse" --version
          fi
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: tgpulse-macos-arm64
          path: dist/*.tar.gz
          if-no-files-found: error

  linux-x86_64:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies on the runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libudev-dev pkg-config
      - name: Test
        run: cargo test --locked --workspace
      - name: Build
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            export TGPULSE_RELEASE_VERSION="$RELEASE_TAG"
          fi
          cargo build --locked --release -p tgpulse
      - name: Package executable
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_SHA:0:8}"
          if [[ -n "$RELEASE_TAG" ]]; then version="$RELEASE_TAG"; fi
          name="tgpulse-${version}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/tgpulse LICENSE README.md "dist/$name/"
          cp -R LICENSES "dist/$name/"
          file "dist/$name/tgpulse" | grep -q 'ELF 64-bit.*x86-64'
          ! ldd "dist/$name/tgpulse" | grep -q 'not found'
          if [[ -n "$RELEASE_TAG" ]]; then
            test "$("dist/$name/tgpulse" --version)" = "tgpulse $version"
          else
            "dist/$name/tgpulse" --version
          fi
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: tgpulse-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows-x86_64:
    needs: validate
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked --workspace
      - name: Build
        run: |
          if ($env:RELEASE_TAG) {
            $env:TGPULSE_RELEASE_VERSION = $env:RELEASE_TAG
          }
          cargo build --locked --release -p tgpulse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package executable
        run: |
          $version = $env:GITHUB_SHA.Substring(0, 8)
          if ($env:RELEASE_TAG) { $version = $env:RELEASE_TAG }
          $name = "tgpulse-$version-windows-x86_64"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item target/release/tgpulse.exe, LICENSE, README.md "dist/$name/"
          Copy-Item LICENSES -Destination "dist/$name/" -Recurse
          $bytes = [IO.File]::ReadAllBytes("dist/$name/tgpulse.exe")
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Not a PE executable' }
          $actual = (& (Resolve-Path "dist/$name/tgpulse.exe") --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RELEASE_TAG -and $actual -ne "tgpulse $version") {
            throw "Unexpected version: $actual"
          }
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: tgpulse-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    needs: [macos-arm64, linux-x86_64, windows-x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tgpulse-*
          path: dist
          merge-multiple: true
      - name: Validate archives and write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          for platform in macos-arm64 linux-x86_64; do
            test -f "tgpulse-${RELEASE_TAG}-${platform}.tar.gz"
            tar tzf "tgpulse-${RELEASE_TAG}-${platform}.tar.gz" > "${platform}.contents"
            grep -q '/tgpulse$' "${platform}.contents"
            grep -q '/LICENSES/MAME-BSD-3-Clause.txt$' "${platform}.contents"
            grep -q '/LICENSES/YMFM-BSD-3-Clause.txt$' "${platform}.contents"
          done
          test -f "tgpulse-${RELEASE_TAG}-windows-x86_64.zip"
          unzip -l "tgpulse-${RELEASE_TAG}-windows-x86_64.zip" > windows.contents
          grep -q 'tgpulse.exe' windows.contents
          grep -q 'LICENSES/MAME-BSD-3-Clause.txt' windows.contents
          grep -q 'LICENSES/YMFM-BSD-3-Clause.txt' windows.contents
          rm -f macos-arm64.contents linux-x86_64.contents windows.contents
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: TGPulse-Next ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
